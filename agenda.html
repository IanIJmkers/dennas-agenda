<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Denna’s Trading — Volledige agenda</title>
<link rel="stylesheet" href="css/system.css">
<link rel="stylesheet" href="css/editor.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <span class="mark">Denna’s Trading</span>
    <a class="tab on" href="agenda.html">Volledige agenda</a>
    <a class="tab" href="snapshot.html">2 maanden</a>
    <span class="spacer"></span>
    <span class="seg" title="Formaat">
      <button class="btn" data-format="story">9:16</button>
      <button class="btn" data-format="post">4:5</button>
    </span>
    <span class="seg" title="Op hoeveel kaarten">
      <button class="btn" data-pages="auto">Auto</button>
      <button class="btn" data-pages="one">1 kaart</button>
    </span>
    <span class="seg" id="pages" hidden title="Pagina">
      <button class="btn" id="prev">◀</button>
      <span class="btn pagelab" data-page-label>1 / 1</span>
      <button class="btn" id="next">▶</button>
    </span>
    <span class="sep"></span>
    <button class="btn" id="preview">Voorbeeld</button>
    <span class="sep"></span>
    <button class="btn primary" id="png">PNG downloaden</button>
    <button class="btn" id="pngall" hidden>Alle pagina's</button>
    <button class="btn" id="pdf">PDF / print</button>
    <span class="sep"></span>
    <button class="btn" id="save">Opslaan</button>
    <button class="btn" id="open">Openen</button>
    <button class="btn" id="share">Deel link</button>
    <button class="btn" id="reset">Herstel</button>
  </header>
  <div class="main">
    <div class="stage"><div class="stage-inner"><div class="page"></div></div></div>
    <aside class="panel" id="panel"></aside>
  </div>
</div>

<script src="js/vendor/qrcode.min.js"></script>
<script src="js/vendor/html-to-image.min.js"></script>
<script src="js/brand.js"></script>
<script src="js/store.js"></script>
<script src="js/editor.js"></script>
<script src="js/card.js"></script>
<script src="js/panel.js"></script>
<script src="js/agenda.js"></script>
<script>
  /* No `extra` here: the Beurzen section explains itself, and a
     second hint above it just pushed the list further down. */
  AgendaPanel.init({ mount: '#panel' });
  Agenda.init();
  Editor.wireBar({ filename: 'dennas-agenda.png', onData: function () { Agenda.render(); } });
</script>
</body>
</html>
